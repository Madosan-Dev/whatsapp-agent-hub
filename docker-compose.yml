services:
  whatsapp-agent-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp-agent-hub
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - DATABASE_URL=sqlite:/app/data/hub.db?mode=rwc
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
